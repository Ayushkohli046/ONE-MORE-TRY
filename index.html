<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One More Try</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class ="game-wrapper">
        <h1>One More Try</h1>
        <p class="subtitle">Just one more run.</p>
        <div class="game-container">
            <canvas id="gameCanvas" width="800" height="500"></canvas>
            <button id="soundButton">🔊 Sound ON</button>
            <div class="hud">
                <div class="hud-item">
                    <span class="hud-label">SCORE</span>
                    <span id="currentScore">0</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">BEST</span>
                    <span id="bestScore">0</span>
                </div>
                <div>
                    <span class="hud-item">COINS</span>
                    <span id="walletCoins">🪙 0</span>
                </div>
            </div>
            <div id="startScreen">
                <h2>ONE MORE TRY</h2>
                <p>Dodge. Collect. Survive.</p>
                <button id="startButton">START GAME</button>
            </div>
            <div id="pauseScreen">
                <h2>PAUSED</h2>
                <p>Take a breath. Your run can wait.</p>
                <button id="resumeButton">RESUME</button>
            </div>
            <div id="countdownScreen">
                <span id="countdownText">3</span>
            </div>
            <button id="restartButton">PLAY AGAIN</button>
        </div>
        <div class="mobile-controls">
            <button id="leftButton">◀ LEFT</button>
            <button id="rightButton">Right ▶</button>
        </div>
        <p class="controls">Use A/D or the arrow keys to move</p>
    </div>

    <script src="game.js"></script>
</body>
</html>
